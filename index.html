  <script src="js/app.js?v=202610191524"></script>
  <script>
  /* Жаңа нұсқа шықса, ескі index.html-ді кэштен алмасын: тексеріп, бетті жаңартады.
     Телефон экранына («Домой») қосылған сайт фонда тұрып қалады, сондықтан қайта ашылғанда және 5 минут сайын тексереді. */
  (function () {
    try {
      var cur = (document.querySelector('script[src*="js/app.js?v="]') || {}).src || "";
      cur = (cur.match(/v=(\d+)/) || [])[1];
      if (!cur || !window.fetch || location.protocol === "file:") return;
      var busy = false;
      function check() {
        if (busy || document.visibilityState === "hidden") return;
        busy = true;
        fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
          busy = false;
          var v = (t.match(/js\/app\.js\?v=(\d+)/) || [])[1];
          if (!v || v === cur || /^#\/test/.test(location.hash)) return; // тест кезінде бөлмейміз
          var k = "bioubt_reload_" + v;
          try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, "1"); } catch (e) {}
          // кэштегі ескі бетті айналып өту үшін жаңа адреспен ашамыз (#/... сақталады)
          location.replace(location.pathname + "?u=" + v + location.hash);
        }).catch(function () { busy = false; });
      }
      check();
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") check(); });
      window.addEventListener("pageshow", function (e) { if (e.persisted) check(); });
      window.addEventListener("focus", check);
      setInterval(check, 5 * 60 * 1000);
    } catch (e) {}
  })();
  </script>
</body>
</html>
