  <script>
  /* Жаңа нұсқа шықса, браузер ескі index.html-ді кэштен алмасын: тексеріп, бетті бір рет жаңартады */
  (function () {
    try {
      var cur = (document.querySelector('script[src*="js/app.js?v="]') || {}).src || "";
      cur = (cur.match(/v=(\d+)/) || [])[1];
      if (!cur || !window.fetch || location.protocol === "file:") return;
      fetch(location.pathname + location.search, { cache: "reload" }).then(function (r) { return r.text(); }).then(function (t) {
        var v = (t.match(/js\/app\.js\?v=(\d+)/) || [])[1];
        var k = "bioubt_reload_" + v;
        try { if (v && v !== cur && !sessionStorage.getItem(k)) { sessionStorage.setItem(k, "1"); location.reload(); } } catch (e) {}
      }).catch(function () {});
    } catch (e) {}
  })();
  </script>
